name: Run Tests

on:
  push:
    branches: [main, develop, 'feature/**', 'playwright-test']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --verbose

  test-types:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run tsc --noEmit

  test-all:
    name: All Tests Summary
    runs-on: ubuntu-latest
    needs: [test-rust, test-types]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Test Results"
          echo "✅ Rust Tests: ${{ needs.test-rust.result }}"
          echo "✅ Type Check: ${{ needs.test-types.result }}"
          
          if [[ "${{ needs.test-rust.result }}" == "failure" ]] || \
             [[ "${{ needs.test-types.result }}" == "failure" ]]; then
            echo "❌ Some tests failed!"
            exit 1
          fi
          echo "✅ All tests passed!"
